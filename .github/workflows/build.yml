name: build

# Testa em macOS e Windows e monta os binários do app (.app/.exe) a cada tag.
# Remove a necessidade de ter uma máquina Windows: os runners do GitHub fazem a build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar (app + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Testes
        run: pytest -q

  package:
    # Só monta binário quando é uma tag (release), depois dos testes passarem.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PanNosoVaxStudio-macos
          - os: windows-latest
            artifact: PanNosoVaxStudio-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: PyInstaller
        # Empacota o app + os assets (UI, scripts, workflow, config) num único bundle.
        run: >
          pyinstaller --noconfirm --windowed --name "PanNosoVax Studio"
          --add-data "app/ui${{ runner.os == 'Windows' && ';' || ':' }}app/ui"
          --add-data "workflow${{ runner.os == 'Windows' && ';' || ':' }}workflow"
          --add-data "scripts${{ runner.os == 'Windows' && ';' || ':' }}scripts"
          --add-data "config${{ runner.os == 'Windows' && ';' || ':' }}config"
          app/desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    # Publica um GitHub Release com os binários anexados.
    # Sem este job, a tag só gera artefatos de CI: exigem login para baixar, expiram
    # em 90 dias e — o que bloqueia o Application Note — o Zenodo arquiva Releases,
    # não artefatos, então não sairia DOI.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # necessário para criar o Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compactar um .zip por plataforma
        # O --windowed do PyInstaller produz um bundle .app no macOS; zipar preserva
        # a estrutura do bundle, que um upload de arquivos soltos quebraria.
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          ls -lh *.zip
      - name: Criar o Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*.zip
          --repo "${{ github.repository }}"
          --title "PanNosoVax Studio ${{ github.ref_name }}"
          --generate-notes
