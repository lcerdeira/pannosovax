project: PanNosoVax-demo
outdir: results_demo
threads: 8
organisms:
  kpsc:
    label: Klebsiella pneumoniae species complex
    taxids:
    - 573
    - 1463165
    - 244366
    - 72407
    n_genomes: 3
    assembly_level:
    - complete
    - chromosome
    reference: GCF_000240185.1
  abau:
    label: Acinetobacter baumannii
    taxids:
    - 470
    n_genomes: 3
    assembly_level:
    - complete
    - chromosome
    reference: GCF_008632635.1
  spneu:
    label: Streptococcus pneumoniae
    taxids:
    - 1313
    n_genomes: 3
    assembly_level:
    - complete
    - chromosome
    reference: GCF_000007045.1
geographic_strata:
  latin_america: 0.25
  africa: 0.15
  asia: 0.25
  europe: 0.2
  north_america: 0.15
pangenome:
  tool: panaroo
  clean_mode: strict
  core_threshold: 0.95
  identity: 0.95
surfaceome:
  gram_negative_ok:
  - OuterMembrane
  - Extracellular
  gram_positive_ok:
  - Cellwall
  - Extracellular
  psortb_min_score: 7.5
  max_tm_helices: 1
  min_length: 100
  max_length: 1200
  functional_boost_keywords:
  - adhesin
  - porin
  - siderophore
  - TonB-dependent
  - pilus
  - fimbri
  - ABC transporter substrate-binding
  - lipoprotein
  - choline-binding
  - sortase
selection:
  min_aa_identity_across_genomes: 0.9
  dnds_max: 1.0
  dnds_method: FEL
  essentiality_db: data/external/deg_essential.tsv
  require_essential_or_virulence: true
epitopes:
  mhc1:
    method: netmhcpan_ba
    lengths:
    - 9
    - 10
    percentile_rank_max: 1.0
    alleles_file: config/alleles_mhc1.txt
  mhc2:
    method: netmhciipan_ba
    lengths:
    - 15
    percentile_rank_max: 2.0
    alleles_file: config/alleles_mhc2.txt
  bcell:
    linear_method: bepipred2
    linear_threshold: 0.55
    min_len: 12
    max_len: 22
    conformational_method: discotope3
  vaxijen_threshold: 0.5
  min_epitope_conservation: 0.95
safety:
  human_proteome: data/external/UP000005640_human.fasta
  commensal_proteomes:
  - data/external/commensal_respiratory.fasta
  - data/external/commensal_gut.fasta
  max_identity_to_self: 0.8
  min_evalue_self: 1e-4
  allergen_check: true
  toxin_check: true
  max_shared_kmer: 6
coverage:
  target_global: 0.9
  target_brazil: 0.9
  populations:
  - World
  - South America
  - Brazil
  - Central Africa
  - Southeast Asia
  - Europe
construct:
  adjuvant: RS09
  adjuvant_linker: EAAAK
  linkers:
    mhc1: AAY
    mhc2: GPGPG
    bcell: KK
  his_tag: true
  exclude_free_cysteine: true
  include_padre: true
  block_order:
  - adjuvant
  - padre
  - bcell
  - mhc2
  - mhc1
  - shared
structure:
  folding: colabfold
  refine: galaxyrefine
  validate:
  - ramachandran
  - errat
  - verify3d
  structural_tm_threshold: 0.5
docking:
  receptors:
    TLR4: 4G8A
    TLR2: 2Z7X
    MHCII_DRB1_0101: 1DLH
  engine: haddock2.4
md:
  engine: gromacs
  forcefield: charmm36-jul2022
  water: tip3p
  ns: 100
  replicates: 3
immunosim:
  tool: c-immsim
  doses: 3
  interval_days: 28
  simulation_steps: 1050
expression:
  host: ecoli_k12
  vector: pET28a
  restriction_avoid:
  - XhoI
  - BamHI
  - NdeI
  - EcoRI
  target_cai_min: 0.8
  gc_range:
  - 0.3
  - 0.7
  also_design_mrna: true
