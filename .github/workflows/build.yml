name: build

# Testa em macOS e Windows e monta os binários do app (.app/.exe) a cada tag.
# Remove a necessidade de ter uma máquina Windows: os runners do GitHub fazem a build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar (app + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Testes
        run: pytest -q

  package:
    # Só monta binário quando é uma tag (release), depois dos testes passarem.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PanNosoVaxStudio-macos
          - os: windows-latest
            artifact: PanNosoVaxStudio-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: PyInstaller
        # Empacota o app + os assets (UI, scripts, workflow, config) num único bundle.
        run: >
          pyinstaller --noconfirm --windowed --name "PanNosoVax Studio"
          --add-data "app/ui${{ runner.os == 'Windows' && ';' || ':' }}app/ui"
          --add-data "workflow${{ runner.os == 'Windows' && ';' || ':' }}workflow"
          --add-data "scripts${{ runner.os == 'Windows' && ';' || ':' }}scripts"
          --add-data "config${{ runner.os == 'Windows' && ';' || ':' }}config"
          app/desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
